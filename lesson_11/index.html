<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Lesson 11</title>
</head>
<body>
    <div class="wrapper">
        <header id="top" class="header">
            <h1>Заняття 11 Трансформації Властивість transform</h1>
        </header>

        <main class="page">
            <div class="page__container">
                <div class="blocks">
                    
                    
                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--translate-px">
                            <h2>Translate 20px 20px</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--translate-procent">
                            <h2>Translate -20% -20%</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--translate-y">
                            <h2>TranslateY 75px</h2>
                        </div> 
                    </div>


                      <div class="blocks__items">
                        <div class="blocks__item blocks__item--scale">
                            <h2>Scale 1.5</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--rotate">
                            <h2>Rotate 10deg</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--skew">
                            <h2>Skew 10deg 15deg</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--transform">
                            <h2>Transform origin</h2>
                        </div> 
                    </div>

                      <div class="blocks__items">
                        <div class="blocks__item blocks__item--scale-small">
                            <h2>Scale 0.3</h2>
                        </div> 
                    </div>

                    <div class="blocks__items">
                        <div class="blocks__item blocks__item--translate3d">
                            <h2>Translate 3D</h2>
                        </div> 
                    </div>

                  
                     <div class="blocks__items">
                        <div class="blocks__item blocks__item--rotate3d">
                            <h2>Rotate 3D and Scale</h2>
                        </div> 
                    </div>

                     <div class="blocks__items">
                        <div class="blocks__item blocks__item--scale3d">
                            <h2>Scale 3D and Rotate</h2>
                        </div> 
                    </div>

                     <div class="blocks__items">
                        <div class="blocks__item blocks__item--origin3d">
                            <h2>Origin 3D</h2>
                        </div> 
                    </div>
                </div>

                <div class="homework">
                    <div class="rocket">
                        <div class="rocket__body"></div>
                        <div class="rocket__window"></div>
                        <div class="rocket__finger rocket__finger--left"></div>
                        <div class="rocket__finger rocket__finger--right"></div>
                        <div class="rocket__engine"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <a href="#top" class="button">На головну</a>
        </footer>
    </div>
    
</body>
</html>
